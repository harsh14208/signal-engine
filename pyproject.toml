[project]
name = "signal-engine"
version = "0.1.0"
description = "Diversified systematic futures trend + carry engine (Carver/AHL style)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "pyarrow>=14.0",      # parquet price cache
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]   # real price fetch; the core engine never imports it
garch = ["arch>=7.0,<9.0"]    # optional GARCH(1,1) forward-vol estimator
hmm = ["hmmlearn>=0.3"]         # optional 2-state macro-regime HMM
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_engine*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
